<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/login.css" />
  
</head>

<body>
  <!--header inicio-->
  <div class="topo">
        <a href="index.html">
            <img class="livro" src="assets/icon/livro.png">
        </a>
        <a href="index.html" class="title">
            Home
        </a>
        <a href="obras.html" class="title">
            Obras
        </a>
        <a href="cadastro.html" class="title_atual">
            Cadastro
        </a>
        <a href="login.html" class="title">
            <img class="login" src="assets/icon/login02.png">
            Login
        </a>
    </div>
  <!--header fim-->

  <div class="card">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    
      <div class="card-cadastro">
        <h2 class="titulo"> Olá! <br> Faça seu Cadastro</h2>
          <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->

        
            <p class="textinho">
            Nome <br>
            <input class="input" id="nome_input" type="text" placeholder="Seu nome" />
            </p>

           <p class="textinho">
            E-mail <br>
            <input class="input" id="email_input" type="text" placeholder="meuemail@provedor.com" />
           </p>

          <p class="textinho">
            Senha <br>
            <input class="input" id="senha_input" type="password" placeholder="******" />
          </p>

          <p class="textinho">
            Confirmação da Senha:
            <input class="input" id="confirmacao_senha_input" type="password" placeholder="******" />
          </p>

          <p class="textinho">
            Já conhecia a história de Nova Esperança? <br>
            <select class="input" name="select" id="select_conhece">
                <option value="Selecione">Selecione...</option>
                <option value="Conhecia um pouco">Conhecia um pouco</option>
                <option value="Sim">Sim</option>
                <option value="Nao">Não</option>
            </select>
        </p>

          <button class="botao" onclick="cadastrar()">Cadastrar</button>
          <p class="entrar" style="color: #2f1d11;"> Já tem uma conta? <br><a class= "entrar" href="pagina_login.html"><b>Entrar</b></a></p>

        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/imgs/aguarde-orange.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>
</body>

</html>

<script>

  function cadastrar() {

    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var conheceVar = select_conhece.value;

    // CAMPOS VAZIOS

    if (
        nomeVar == "" ||
        emailVar == "" ||
        senhaVar == "" ||
        confirmacaoSenhaVar == "" ||
        conheceVar == "Selecione"
    ) {

        cardErro.style.display = "block";

        mensagem_erro.innerHTML =
        "Preencha todos os campos.";

        return false;
    }

    // SENHAS DIFERENTES

    if (senhaVar != confirmacaoSenhaVar) {

        cardErro.style.display = "block";

        mensagem_erro.innerHTML =
        "As senhas não coincidem.";

        return false;
    }

    // FETCH

    fetch("/usuarios/cadastrar", {
        method: "POST",

        headers: {
            "Content-Type": "application/json",
        },

        body: JSON.stringify({

            nomeServer: nomeVar,
            emailServer: emailVar,
            senhaServer: senhaVar,
            conheceServer: conheceVar

        }),
    })

    .then(function (resposta) {

        console.log("resposta: ", resposta);

        if (resposta.ok) {

            cardErro.style.display = "block";

            mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso!";

            setTimeout(() => {

                window.location = "login.html";

            }, 2000);

        } else {

            throw "Erro ao realizar cadastro";

        }
    })

    .catch(function (erro) {

        console.log("#ERRO:", erro);

    });

    return false;
}

function sumirMensagem() {

    cardErro.style.display = "none";

}

</script>
