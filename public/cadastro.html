<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/login.css" />

</head>

<body>
  <!--header inicio-->
  <div class="topo">
    <a href="index.html">
      <img class="livro" src="assets/icon/livro.png">
    </a>
    <a href="index.html" class="title">
      Home
    </a>
    <a href="memorias.html" class="title">
      Memórias
    </a>
    <a href="cadastro.html" class="title_atual">
      Cadastro
    </a>
    <a href="login.html" class="title">
      <img class="login" src="assets/icon/login02.png">
      Login
    </a>
  </div>
  <!--header fim-->

  <div class="card">

    <div class="card-cadastro">

      <h2 class="titulo">Olá! <br> Faça seu Cadastro</h2>

      <p class="textinho">
        Nome <br>
        <input class="input" id="nome_input" type="text" placeholder="Seu nome" />
      </p>
      <div id="erro_nome" class="erro"></div>

      <p class="textinho">
        E-mail <br>
        <input class="input" id="email_input" type="text" placeholder="meuemail@provedor.com" />
      </p>
      <div id="erro_email" class="erro"></div>

      <p class="textinho">
        Senha <br>
        <input class="input" id="senha_input" type="password" placeholder="******" />
      </p>
      <div id="erro_senha" class="erro"></div>

      <p class="textinho">
        Confirmação da Senha <br>
        <input class="input" id="confirmacao_senha_input" type="password" placeholder="******" />
      </p>
      <div id="erro_confirmacao" class="erro"></div>

      <p class="textinho">
        Já conhecia a história de Nova Esperança? <br>

        <select class="input" id="select_conhece">
          <option value="Selecione">Selecione...</option>
          <option value="Conhecia um pouco">Conhecia um pouco</option>
          <option value="Sim">Sim</option>
          <option value="Nao">Não</option>
        </select>
      </p>

      <div id="erro_select" class="erro"></div>

      <button class="botao" onclick="cadastrar()">Cadastrar</button>

      <div id="mensagem_sucesso"></div>

    </div>

  </div>

  <script>

    function cadastrar() {

      var nomeVar = nome_input.value;
      var emailVar = email_input.value;
      var senhaVar = senha_input.value;
      var confirmacaoSenhaVar = confirmacao_senha_input.value;
      var conheceVar = select_conhece.value;

      let caracter = ["!", "@", "#", "$", "%", "^", "&", "*"];
      let temCaracter = false;

      // LIMPAR ERROS

      erro_nome.innerHTML = "";
      erro_email.innerHTML = "";
      erro_senha.innerHTML = "";
      erro_confirmacao.innerHTML = "";
      erro_select.innerHTML = "";
      mensagem_sucesso.innerHTML = "";

      // NOME

      if (nomeVar == "") {

        erro_nome.innerHTML = "Preencha o nome";
        return false;
      }

      // EMAIL

      if (emailVar == "") {

        erro_email.innerHTML = "Preencha o email";
        return false;
      }

      if (!emailVar.includes("@") || !emailVar.includes(".")) {

        erro_email.innerHTML = "Email inválido";
        return false;
      }

      // SENHA

      if (senhaVar == "") {

        erro_senha.innerHTML = "Preencha a senha";
        return false;
      }

      if (senhaVar.length < 6) {

        erro_senha.innerHTML = "A senha deve ter pelo menos 6 caracteres";
        return false;
      }

      // CARACTERE ESPECIAL

      for (let i = 0; i < senhaVar.length; i++) {

        if (caracter.includes(senhaVar[i])) {

          temCaracter = true;
          break;
        }
      }

      if (!temCaracter) {

        erro_senha.innerHTML = "A senha deve conter caractere especial";
        return false;
      }

      // CONFIRMAÇÃO

      if (confirmacaoSenhaVar == "") {

        erro_confirmacao.innerHTML = "Confirme a senha";
        return false;
      }

      if (senhaVar != confirmacaoSenhaVar) {

        erro_confirmacao.innerHTML = "As senhas não coincidem";
        return false;
      }

      // SELECT

      if (conheceVar == "Selecione") {

        erro_select.innerHTML = "Selecione uma opção";
        return false;
      }

      // FETCH

      fetch("/usuarios/cadastrar", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          nomeServer: nomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar,
          conheceServer: conheceVar

        })

      })

        .then(function (resposta) {

          if (resposta.ok) {

            mensagem_sucesso.innerHTML =
              "Cadastro realizado com sucesso!";

            setTimeout(() => {

              window.location = "login.html";

            }, 2000);

          } else {

            throw ("Erro ao cadastrar");

          }

        })

        .catch(function (erro) {

          console.log(erro);

        });

      return false;
    }

  </script>
