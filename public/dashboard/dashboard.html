<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script src="../js/sessao.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    

</head>

<body onload="validarSessao()">

    <div class="janela">
        <div class="header-left">
            <h1>De Capelinha a Nova Esperança</h1>

            <div class="hello">
                <h3>Olá, <span class= "nome" id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./obras.html">
                    <h3>Obras</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <h3>Dashboard</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Voltar para o Site Institucional</h3>
            </div>

        </div>


        <!-- DASHBOARD -->

        <div class="dashboard">

            <h1>Dashboard</h1>

            <p class="subtitulo">
Acompanhe dados, obras e estatísticas do projeto.
</p>

            <!-- KPIS -->

            <div class="kpis">

                <div class="kpi">

                    <div class="icone">👤</div>

                    <h2>Total de Usuários</h2>

                    <span id="kpiUsuarios">0</span>

                </div>

                <div class="kpi">

                    <div class="icone">📚</div>

                    <h2>Obra Mais Selecionada</h2>

                    <span id="kpiObra"></span>

                </div>

                <div class="kpi">

                    <div class="icone">🤎</div>
                    <h2>Sua Obra Favorita</h2>
                    <span id="kpiUsuario"></span>

                </div>

            </div>



            <!-- GRÁFICOS -->

            <div class="graficos">

                <!-- PIZZA -->

                <div class="card_grafico">

                    <h2>
                        Conhecimento sobre Nova Esperança
                    </h2>

                    <div class="grafico-container">

                        <canvas id="graficoPizza"></canvas>

                    </div>

                </div><body onload="preencherNome()"></body>


                <!-- BARRAS -->

                <div class="card_grafico">

                    <h2>
                        Obras mais selecionadas
                    </h2>

                    <div class="grafico-container">

                        <canvas id="graficoBarra"></canvas>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>

<script>

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    window.onload = function () {

        obterDadosGrafico();
        obterDadosGraficoPizza();
        obterKPIs();

    }

    /* ============================
            KPIs
    ============================ */

    function obterKPIs() {

        obterTotalUsuarios();
        obterObraMaisSelecionada();
        obterObraUsuario();

    }

    function obterTotalUsuarios() {

        fetch("/dashboard/totalUsuarios")

            .then(function (resposta) {

                return resposta.json();

            })

            .then(function (dados) {

                kpiUsuarios.innerHTML = dados[0].totalUsuarios;

            });

    }

    function obterObraMaisSelecionada() {

        fetch("/dashboard/obraMaisSelecionada")

            .then(function (resposta) {

                return resposta.json();

            })

            .then(function (dados) {

                kpiObra.innerHTML = dados[0].titulo;

            });

    }

    function obterObraUsuario() {

        var idUsuario = sessionStorage.ID_USUARIO;

        fetch(`/dashboard/obraUsuario/${idUsuario}`)

            .then(function (resposta) {

                return resposta.json();

            })

            .then(function (dados) {

                if (dados.length > 0) {

                    kpiUsuario.innerHTML = dados[0].titulo;

                } else {

                    kpiUsuario.innerHTML = "Nenhuma";

                }

            });

    }

    /* ============================
        GRÁFICO DE BARRAS
    ============================ */

    function obterDadosGrafico() {

        fetch("/dashboard/curtidasObras")

            .then(function (resposta) {

                if (resposta.ok) {

                    resposta.json().then(function (resposta) {

                        console.log("Dados recebidos: ", JSON.stringify(resposta));

                        plotarGrafico(resposta);

                    });

                } else {

                    console.error('Nenhum dado encontrado');

                }

            })

            .catch(function (erro) {

                console.log(erro);

            });

    }

    function plotarGrafico(resposta) {

        let labels = [];

        let dados = {

            labels: labels,

            datasets: [{

                label: 'Quantidade de Curtidas',

                data: [],

                borderWidth: 1,

                backgroundColor: 'rgba(123, 90, 69, 0.9)',


            }]
        };

        for (let i = 0; i < resposta.length; i++) {

            var registro = resposta[i];

            labels.push(registro.titulo);

            dados.datasets[0].data.push(registro.totalCurtidas);

        }

        const config = {

            type: 'bar',

            data: dados,

            options: {

                responsive: true,

                scales: {

                    y: {

                        beginAtZero: true

                    }
                }
            }
        };

        let myChart = new Chart(

            document.getElementById(`graficoBarra`),

            config

        );

        setInterval(() => atualizarGrafico(myChart), 5000);

    }

    function atualizarGrafico(myChart) {

        fetch("/dashboard/curtidasObras", { cache: 'no-store' })

            .then(function (response) {

                if (response.ok) {

                    response.json().then(function (novoRegistro) {

                        myChart.data.labels = [];
                        myChart.data.datasets[0].data = [];

                        for (let i = 0; i < novoRegistro.length; i++) {

                            myChart.data.labels.push(novoRegistro[i].titulo);

                            myChart.data.datasets[0].data.push(novoRegistro[i].totalCurtidas);

                        }

                        myChart.update();

                    });

                }

            })

            .catch(function (error) {

                console.error(error);

            });

    }

    /* ============================
        GRÁFICO PIZZA
    ============================ */

    function obterDadosGraficoPizza() {

        fetch("/dashboard/conhecimento",{
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            },
        }).then(function (response) {

                if (response.ok) {

                    response.json().then(function (resposta) {

                        plotarGraficoPizza(resposta);

                    });

                } else {

                    console.error('Nenhum dado encontrado');

                }

            })

            .catch(function (erro) {

                console.log(erro);

            });

    }

    function plotarGraficoPizza(resposta) {

        let labels = [];

        let dados = {

            labels: labels,

            datasets: [{

                label: 'Usuários',

                data: []

            }]
        };

        for (let i = 0; i < resposta.length; i++) {

            var registro = resposta[i];

            labels.push(registro.conhece);

            dados.datasets[0].data.push(registro.percentual);

        }

        const config = {

            type: 'pie',

            data: dados,

            options: {

                responsive: true,
                

            }
        };

        let myChart = new Chart(

            document.getElementById(`graficoPizza`),

            config

        );

        setInterval(() => atualizarGraficoPizza(myChart), 5000);

    }

    function atualizarGraficoPizza(myChart) {

        fetch("/dashboard/conhecimento", { cache: 'no-store' })

            .then(function (response) {

                if (response.ok) {

                    response.json().then(function (novoRegistro) {

                        myChart.data.labels = [];

                        myChart.data.datasets[0].data = [];

                        for (let i = 0; i < novoRegistro.length; i++) {

                            myChart.data.labels.push(novoRegistro[i].conhece);

                            myChart.data.datasets[0].data.push(novoRegistro[i].percentual);

                        }

                        myChart.update();

                    });

                }

            })

            .catch(function (error) {

                console.error(error);

            });

    }

    function preencherNome() {
        var email = sessionStorage.EMAIL_USUARIO;
        var nome = sessionStorage.NOME_USUARIO;

        document.getElementById("b_usuario").innerHTML = nome;
    }

</script>
