<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css">

    <script src="../js/sessao.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="obterDados()">

    <div class="janela">

        <div class="header-left">

            <h1>De Capelinha a Nova Esperança</h1>

            <div class="hello">
                <h3>
                    Olá,
                    <span id="b_usuario">usuário</span>!
                </h3>
            </div>

            <div class="btn-nav-white">
                <a href="./obras.html">
                    <h3>Obras</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <h3>Dashboard</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Voltar para o Site Institucional</h3>
            </div>

        </div>

        <div class="dashboard">

            <h1 class="titulo">Dashboard</h1>

            <div class="kpis">

                <div class="kpi">
                    <h2>Total de usuários</h2>
                    <p id="kpiUsuarios">0</p>
                </div>

                <div class="kpi">
                    <h2>Obra mais curtida</h2>
                    <p id="kpiObra">0</p>
                </div>

                <div class="kpi">
                    <h2>Total de curtidas</h2>
                    <p id="kpiCurtidas">0</p>
                </div>

                <div class="kpi">
                    <h2>Pessoas que conhecem arte</h2>
                    <p id="kpiConhece">0%</p>
                </div>

            </div>

            <div class="graficos">

                <div class="card_grafico">
                    <h2>Nível de conhecimento sobre arte</h2>
                    <div class="grafico-container">
                        <canvas id="graficoPizza"></canvas>
                    </div>
                </div>

                <div class="card_grafico">
                    <h2>Obras mais curtidas</h2>
                    <div class="grafico-container">
                        <canvas id="graficoBarra"></canvas>
                    </div>
                </div>

            </div>

        </div>

    </div>

</body>

</html>

<script>

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    let graficoPizza;
    let graficoBarra;

    function obterDados() {

        fetch("/dashboard/dados", { cache: "no-store" })

            .then(function (resposta) {

                if (resposta.ok) {

                    resposta.json().then(function (dados) {

                        console.log(dados);

                        plotarGrafico(dados);

                    });

                } else {

                    console.log("Erro ao buscar dados");

                }

            })

            .catch(function (erro) {

                console.log(erro);

            });

    }

    function plotarGrafico(dados) {

        // KPI

        document.getElementById("kpiUsuarios").innerHTML =
            dados.totalUsuarios;

        document.getElementById("kpiCurtidas").innerHTML =
            dados.totalCurtidas;

        document.getElementById("kpiObra").innerHTML =
            dados.obraMaisCurtida;

        document.getElementById("kpiConhece").innerHTML =
            dados.porcentagemConhece + "%";


        // GRÁFICO PIZZA

        const ctxPizza =
            document.getElementById("graficoPizza");

        graficoPizza = new Chart(ctxPizza, {

            type: 'pie',

            data: {

                labels: [

                    'Conhece',
                    'Conhece Pouco',
                    'Não Conhece'

                ],

                datasets: [{

                    data: [

                        dados.conhece,
                        dados.conhecePouco,
                        dados.naoConhece

                    ],

                    backgroundColor: [

                        '#5c3b1e',
                        '#8b5a2b',
                        '#c7a17a'

                    ],

                    borderWidth: 0

                }]

            },

            options: {

                responsive: true,

                plugins: {

                    legend: {

                        position: 'right',

                        labels: {

                            color: '#4b2e19',
                            font: {
                                size: 14,
                                family: "Arial"
                            }

                        }

                    }

                }

            }

        });


        // GRÁFICO BARRA

        const ctxBarra =
            document.getElementById("graficoBarra");

        graficoBarra = new Chart(ctxBarra, {

            type: 'bar',

            data: {

                labels: dados.obras,

                datasets: [{

                    label: 'Curtidas',

                    data: dados.curtidas,

                    backgroundColor: [

                        '#5c3b1e',
                        '#7c4e2c',
                        '#a06b45',
                        '#d4b08c',
                        '#6d4b35',
                        '#8a5a44',
                        '#b07a52',
                        '#d9b89c'

                    ],

                    borderRadius: 12

                }]

            },

            options: {

                responsive: true,

                plugins: {

                    legend: {

                        labels: {

                            color: '#4b2e19',
                            font: {
                                size: 14,
                                family: "Arial"
                            }

                        }

                    }

                },

                scales: {

                    y: {

                        beginAtZero: true,

                        ticks: {

                            color: '#4b2e19'

                        }

                    },

                    x: {

                        ticks: {

                            color: '#4b2e19'

                        }

                    }

                }

            }

        });

        setTimeout(atualizarDados, 5000);

    }

    function atualizarDados() {

        fetch("/dashboard/dados", { cache: "no-store" })

            .then(function (resposta) {

                if (resposta.ok) {

                    resposta.json().then(function (novosDados) {

                        // KPI

                        document.getElementById("kpiUsuarios").innerHTML =
                            novosDados.totalUsuarios;

                        document.getElementById("kpiCurtidas").innerHTML =
                            novosDados.totalCurtidas;

                        document.getElementById("kpiObra").innerHTML =
                            novosDados.obraMaisCurtida;

                        document.getElementById("kpiConhece").innerHTML =
                            novosDados.porcentagemConhece + "%";


                        // PIZZA

                        graficoPizza.data.datasets[0].data = [

                            novosDados.conhece,
                            novosDados.conhecePouco,
                            novosDados.naoConhece

                        ];

                        graficoPizza.update();


                        // BARRAS

                        graficoBarra.data.labels =
                            novosDados.obras;

                        graficoBarra.data.datasets[0].data =
                            novosDados.curtidas;

                        graficoBarra.update();

                        setTimeout(atualizarDados, 5000);

                    });

                }

            })

            .catch(function (erro) {

                console.log(erro);

            });

    }

</script>
