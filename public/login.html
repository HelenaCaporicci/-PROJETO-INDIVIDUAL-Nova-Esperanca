<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="./css/login.css">

</head>

<body>

    <!--Header-->

    <div class="topo">
        <a href="index.html">
            <img class="livro" src="assets/icon/livro.png">
        </a>
        <a href="index.html" class="title">
            Home
        </a>
        <a href="memorias.html" class="title">
            Memórias
        </a>
        <a href="cadastro.html" class="title">
            Cadastro
        </a>
        <a href="login.html" class="title_atual">
            <img class="login" src="assets/icon/login.png">
            Login
        </a>
    </div>
    <br>

    <div class="card">
        
        <div class="card-cadastro">
            <h2 class="titulo">Olá de volta!</h2>
            <p class="textinho">
                E-mail <br>
                <input class="input" id="email_input" type="text" placeholder="Login">
            </p>

            <p class="textinho">
                Senha <br>
                <input class="input" id="senha_input" type="password" placeholder="******">
            </p>
            <button class="botao" onclick="entrar()">Entrar</button>
            <p class="entrar" style="color: #2f1d11;"> Não tem uma conta? <br> <a class="entrar"
                    href="cadastro.html"><b>Cadastrar-se</b></a></p>
        </div>


        <div id="div_aguardar" class="loading-div">
            <img src="./assets/imgs/aguarde-orange.gif" id="loading-gif">
        </div>

        <div id="div_erros_login"></div>
    </div>
    </div>
    </div>

</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {

                    console.log("JSON LOGIN:", json);

                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    console.log("ID SALVO:", sessionStorage.ID_USUARIO);

                    setTimeout(function () {
                        window.location = "./dashboard/obras.html";
                    }, 1000);

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
